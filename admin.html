<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moonvera Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d1b2a; --navy2: #1a2f44; --gold: #c9a84c;
      --white: #fff; --gray: #6b7280; --light: #f3f4f6;
      --border: #e5e7eb; --red: #e74c3c; --green: #27ae60; --radius: 10px;
    }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; color: var(--navy); min-height: 100vh; }

    /* ── LOGIN ── */
    #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--navy); }
    .login-card { background: white; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    .login-card h1 { font-size: 1.5rem; margin-bottom: .25rem; }
    .login-card p { color: var(--gray); font-size: .875rem; margin-bottom: 1.5rem; }

    /* ── SHARED FORM ── */
    .form-field { margin-bottom: 1rem; }
    .form-field label { display: block; font-size: .75rem; font-weight: 700; color: var(--gray); margin-bottom: .35rem; text-transform: uppercase; letter-spacing: .5px; }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%; padding: .7rem 1rem; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: .9rem; font-family: inherit;
      outline: none; transition: border-color .2s; background: white;
    }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--gold); }
    .form-field textarea { resize: vertical; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1rem; }
    .form-grid .form-field { margin-bottom: 0; }
    .form-grid .span2 { grid-column: 1 / -1; }
    .form-actions { display: flex; gap: .75rem; margin-top: 1.25rem; flex-wrap: wrap; }

    /* ── BUTTONS ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: .65rem 1.25rem; border-radius: 8px; font-size: .875rem; font-weight: 600; cursor: pointer; border: none; transition: all .2s; text-decoration: none; }
    .btn-gold { background: var(--gold); color: white; }
    .btn-gold:hover { background: #b8943e; }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--navy); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-red { background: var(--red); color: white; }
    .btn-red:hover { background: #c0392b; }
    .btn-sm { padding: .35rem .75rem; font-size: .78rem; }
    .btn-full { width: 100%; }

    /* ── ADMIN LAYOUT ── */
    #adminPanel { display: none; min-height: 100vh; }
    .admin-header { background: var(--navy); padding: 0 2rem; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .admin-header h1 { color: white; font-size: 1.1rem; }
    .admin-header h1 span { color: var(--gold); }
    .admin-body { padding: 2rem; max-width: 1100px; margin: 0 auto; }

    /* ── CARD ── */
    .card { background: white; border-radius: var(--radius); padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 1.5rem; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: .5rem; }
    .card-title { font-size: 1.05rem; font-weight: 700; }

    /* ── ALERT ── */
    .alert { padding: .7rem 1rem; border-radius: 8px; font-size: .875rem; margin-bottom: 1rem; }
    .alert-error { background: #fdecea; color: var(--red); }
    .alert-success { background: #e8f5e9; color: var(--green); }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; color: var(--gray); padding: 2.5rem 1rem; font-size: .9rem; }

    /* ── ACTIVITIES ── */
    .act-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 1.25rem; }
    .act-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; }
    .act-card img { width: 100%; height: 170px; object-fit: cover; display: block; }
    .act-card-body { padding: .9rem; }
    .act-card-title { font-weight: 700; font-size: .92rem; margin-bottom: .3rem; }
    .act-card-desc { font-size: .8rem; color: var(--gray); line-height: 1.55; margin-bottom: .75rem; max-height: 60px; overflow: hidden; }
    .upload-zone { border: 2px dashed var(--border); border-radius: 10px; padding: 2rem; text-align: center; cursor: pointer; transition: border-color .2s; background: var(--light); }
    .upload-zone:hover, .upload-zone.drag { border-color: var(--gold); background: #fdf9f0; }
    .upload-zone p { color: var(--gray); font-size: .85rem; margin-top: .5rem; }
    #actPreview { margin-top: 1rem; display: none; }
    #actPreview img { max-width: 100%; max-height: 220px; border-radius: 8px; border: 1px solid var(--border); object-fit: contain; }
    .progress-bar { height: 6px; background: var(--light); border-radius: 3px; margin-top: .75rem; overflow: hidden; display: none; }
    .progress-fill { height: 100%; background: var(--gold); border-radius: 3px; transition: width .3s; width: 0%; }
  </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginScreen">
  <div class="login-card">
    <h1>Moon<span style="color:var(--gold)">vera</span> Admin</h1>
    <p>Enter your admin password to manage website content</p>
    <div id="loginAlert"></div>
    <form id="loginForm">
      <div class="form-field">
        <label>Admin Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required autofocus />
      </div>
      <button type="submit" class="btn btn-gold btn-full" style="margin-top:.5rem" id="loginBtn">Sign In</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:.8rem;color:var(--gray)">Contact admin for password</p>
  </div>
</div>

<!-- ══ ADMIN PANEL ══ -->
<div id="adminPanel">
  <header class="admin-header">
    <h1>Moon<span>vera</span> Admin — 📸 Activities</h1>
    <div style="display:flex;gap:.75rem;align-items:center">
      <a href="index.html" class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.25);font-size:.8rem">← View Site</a>
      <button class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.25);font-size:.8rem" onclick="signOut()">Sign Out</button>
    </div>
  </header>

  <div class="admin-body">

    <!-- ── UPLOAD FORM ── -->
    <div class="card">
      <div class="card-header"><div class="card-title">Upload Activity Photo</div></div>
      <div id="act-alert"></div>
      <form id="actForm">
        <div class="form-grid">
          <div class="form-field span2">
            <label>Activity Title</label>
            <input type="text" id="actTitle" placeholder="e.g. Site Visit – Chennai Project" required />
          </div>
          <div class="form-field span2">
            <label>Description</label>
            <textarea id="actDesc" rows="3" placeholder="Brief description of this activity..."></textarea>
          </div>
          <div class="form-field span2">
            <label>Photo</label>
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('actPhoto').click()">
              <div style="font-size:2rem;">📷</div>
              <p>Click to select a photo or drag & drop here</p>
              <p style="font-size:.75rem;margin-top:.25rem;">JPG, PNG, WEBP — auto compressed</p>
            </div>
            <input type="file" id="actPhoto" accept="image/*" style="display:none" required />
            <div id="actPreview"><img id="actPreviewImg" src="" alt="Preview" /></div>
            <div class="progress-bar" id="uploadProgress"><div class="progress-fill" id="uploadFill"></div></div>
          </div>
        </div>
        <div class="form-actions" style="margin-top:1rem;">
          <button type="submit" class="btn btn-gold" id="actSubmitBtn">📤 Upload & Save</button>
          <button type="button" class="btn btn-outline" onclick="resetActForm()">Clear</button>
        </div>
      </form>
    </div>

    <!-- ── ALL PHOTOS ── -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">All Activity Photos</div>
        <span id="actCount" style="color:var(--gray);font-size:.85rem;"></span>
      </div>
      <div class="act-grid" id="actGrid"></div>
    </div>

  </div>
</div>

<script>
  const SUPA_URL = 'https://kqdyemwpacrvrpfxwsrr.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxZHllbXdwYWNydnJwZnh3c3JyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MDkwNDYsImV4cCI6MjEwMzQ4NTA0Nn0._nEiaiQWUMlV7wCEYi8GZ4hX59t7IQV3d3X9ZOn4dsY';
  const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

  const PASS_HASH = '2c316ba9e1a416a6e624698c1df2bf7424278e24e44fa0d9057066fe40b50161';

  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function showPanel(loggedIn) {
    document.getElementById('loginScreen').style.display = loggedIn ? 'none' : 'flex';
    document.getElementById('adminPanel').style.display  = loggedIn ? 'block' : 'none';
    if (loggedIn) loadActivities();
  }

  if (sessionStorage.getItem('mv_admin') === '1') showPanel(true);

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Checking…'; btn.disabled = true;
    const hash = await sha256(document.getElementById('loginPassword').value);
    if (hash === PASS_HASH) {
      sessionStorage.setItem('mv_admin', '1');
      showPanel(true);
    } else {
      document.getElementById('loginAlert').innerHTML = `<div class="alert alert-error">Wrong password. Please try again.</div>`;
      btn.textContent = 'Sign In'; btn.disabled = false;
    }
  });

  function signOut() {
    sessionStorage.removeItem('mv_admin');
    showPanel(false);
  }

  function showAlert(id, msg, type = 'success') {
    const el = document.getElementById(id);
    el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    setTimeout(() => el.innerHTML = '', 3500);
  }

  // ══ ACTIVITIES ══
  async function loadActivities() {
    const { data, error } = await sb.from('activities').select('*').order('created_at', { ascending: false });
    if (error) { showAlert('act-alert', error.message, 'error'); return; }
    const list = data || [];
    document.getElementById('actCount').textContent = `${list.length} photo${list.length !== 1 ? 's' : ''}`;
    const grid = document.getElementById('actGrid');
    if (!list.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">No activities yet — upload one above.</div>';
      return;
    }
    grid.innerHTML = list.map(a => `
      <div class="act-card">
        <img src="${a.image_url}" alt="${a.title}" loading="lazy" />
        <div class="act-card-body">
          <div class="act-card-title">${a.title}</div>
          <div class="act-card-desc">${a.description || ''}</div>
          <div style="display:flex;gap:.5rem;align-items:center;">
            <span style="font-size:.72rem;color:var(--gray);">${new Date(a.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</span>
            <button class="btn btn-red btn-sm" style="margin-left:auto" onclick="deleteActivity('${a.id}')">Delete</button>
          </div>
        </div>
      </div>`).join('');
  }

  // Photo preview + drag-drop
  const actPhotoInput = document.getElementById('actPhoto');
  const uploadZone = document.getElementById('uploadZone');

  function previewFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      document.getElementById('actPreviewImg').src = ev.target.result;
      document.getElementById('actPreview').style.display = 'block';
      uploadZone.style.borderColor = 'var(--gold)';
    };
    reader.readAsDataURL(file);
  }

  actPhotoInput.addEventListener('change', e => previewFile(e.target.files[0]));
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault(); uploadZone.classList.remove('drag');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      const dt = new DataTransfer(); dt.items.add(file);
      actPhotoInput.files = dt.files;
      previewFile(file);
    }
  });

  function compressImage(file, maxPx = 1000, quality = 0.75) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxPx || h > maxPx) {
          if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = url;
    });
  }

  document.getElementById('actForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const file = actPhotoInput.files[0];
    if (!file) { showAlert('act-alert', 'Please select a photo first.', 'error'); return; }
    const btn = document.getElementById('actSubmitBtn');
    btn.textContent = 'Saving…'; btn.disabled = true;
    document.getElementById('uploadProgress').style.display = 'block';
    document.getElementById('uploadFill').style.width = '50%';

    const base64 = await compressImage(file);
    document.getElementById('uploadFill').style.width = '80%';

    const { error } = await sb.from('activities').insert({
      title: document.getElementById('actTitle').value.trim(),
      description: document.getElementById('actDesc').value.trim(),
      image_url: base64
    });
    document.getElementById('uploadFill').style.width = '100%';
    if (error) showAlert('act-alert', error.message, 'error');
    else { showAlert('act-alert', '✓ Activity saved successfully!'); resetActForm(); loadActivities(); }
    btn.textContent = '📤 Upload & Save'; btn.disabled = false;
    setTimeout(() => document.getElementById('uploadProgress').style.display = 'none', 800);
  });

  async function deleteActivity(id) {
    if (!confirm('Delete this activity photo? This cannot be undone.')) return;
    const { error } = await sb.from('activities').delete().eq('id', id);
    if (error) showAlert('act-alert', error.message, 'error');
    else { showAlert('act-alert', 'Photo deleted.'); loadActivities(); }
  }

  function resetActForm() {
    document.getElementById('actForm').reset();
    document.getElementById('actPreview').style.display = 'none';
    uploadZone.style.borderColor = '';
  }
</script>
</body>
</html>
